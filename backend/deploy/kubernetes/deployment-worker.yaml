# Template: Gemini-backed worker (ingestion, jd, or analysis).
# Duplicate and set metadata.name, labels.app, and container.args to the right module.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brb-analysis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: brb-analysis
  template:
    metadata:
      labels:
        app: brb-analysis
    spec:
      containers:
        - name: api
          image: YOUR_REGISTRY/better-resume-backend:latest
          args:
            - uvicorn
            - services.analysis.app:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: production
            - name: PYTHONPATH
              value: /app
            - name: DISABLE_CLIENT_GEMINI_KEY_HEADER
              value: "true"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: brb-gemini
                  key: GEMINI_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: brb-analysis
spec:
  selector:
    app: brb-analysis
  ports:
    - port: 8000
      targetPort: 8000
